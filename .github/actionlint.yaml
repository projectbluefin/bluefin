# Configuration for actionlint
# https://github.com/rhysd/actionlint/blob/main/docs/config.md
#
# actionlint does not yet know the ubuntu-26.04 runner images that Renovate
# is moving workflows to. Until upstream adds them, list them here so the
# pre-commit hook in validate-pr does not reject every ubuntu-26.04 bump.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
