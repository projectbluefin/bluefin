name: Promote testing to main

on:
  push:
    branches:
      - testing
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: promote-testing-to-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read
  actions: read
  statuses: write

jobs:
  release_window:
    uses: ./.github/workflows/reusable-release-window.yml
    outputs:
      should_enqueue: ${{ jobs.release_window.outputs.should_enqueue }}

  promote:
    needs: [release_window]
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@v1
    with:
      variants: >-
        [{"image":"bluefin"},{"image":"bluefin-nvidia"}]
      cosign_identity_regexp: >-
        ^https://github\.com/projectbluefin/(bluefin|actions)/\.github/workflows/
      run_e2e: false
      # main uses a merge queue ruleset (gh pr merge --auto is blocked), so this
      # input is the release gate: it routes to enqueuePullRequest GraphQL when
      # true. Kept tied to the release-window output (bluefin#1066) — do not pin
      # it constant, or the Tuesday-only stable gate becomes decoration.
      use_merge_queue: ${{ needs.release_window.outputs.should_enqueue == 'true' }}
    secrets: inherit
