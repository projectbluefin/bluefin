name: Promote testing to main

on:
  push:
    branches:
      - testing
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: promote-testing-to-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read
  actions: read
  statuses: write

jobs:
  release_window:
    uses: ./.github/workflows/check-release-window.yml

  promote:
    needs: [release_window]
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@v1
    with:
      variants: >-
        [{"image":"bluefin"},{"image":"bluefin-nvidia"}]
      cosign_identity_regexp: >-
        ^https://github\.com/projectbluefin/(bluefin|actions)/\.github/workflows/
      # Release qualification is the successful Post-Testing E2E run for the
      # exact testing-branch SHA. The reusable workflow verifies that evidence
      # before its enqueue job can run.
      run_e2e: true
      e2e_suites: smoke,common
      e2e_image: ghcr.io/projectbluefin/bluefin:testing
      # main always uses its merge queue. Cadence is an independent decision:
      # push and non-Tuesday runs refresh the PR, while Tuesday UTC and manual
      # runs enroll the verified PR automatically.
      use_merge_queue: true
      enqueue_promotion: ${{ needs.release_window.outputs.should_enqueue == 'true' }}
      request_reviewer: false
    secrets: inherit
