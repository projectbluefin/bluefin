name: Promote testing to main

on:
  push:
    branches:
      - testing
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Post-Testing E2E"]
    types: [completed]

concurrency:
  group: promote-testing-to-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read
  actions: read
  statuses: write

jobs:
  release_window:
    uses: ./.github/workflows/check-release-window.yml

  promote:
    needs: [release_window]
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@v1
    with:
      variants: >-
        [{"image":"bluefin"},{"image":"bluefin-nvidia"}]
      cosign_identity_regexp: >-
        ^https://github\.com/projectbluefin/(bluefin|actions)/\.github/workflows/
      # Release qualification is the producer-published status on the exact
      # testing-branch commit. post-testing-e2e writes it only after testing
      # that commit's image and promoting those digests to :testing.
      run_e2e: true
      e2e_suites: smoke,common
      e2e_image: ghcr.io/projectbluefin/bluefin:testing
      e2e_status_context: e2e/post-testing
      # main always uses its merge queue. Pushes and non-Tuesday completions
      # refresh the PR; Tuesday UTC E2E completion and manual runs verify and
      # enroll it automatically.
      use_merge_queue: true
      enqueue_promotion: ${{ needs.release_window.outputs.should_enqueue == 'true' }}
      request_reviewer: false
    secrets: inherit
