name: Promote testing to main

on:
  push:
    branches:
      - testing
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: promote-testing-to-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read
  actions: read
  statuses: write

jobs:
  release_window:
    uses: ./.github/workflows/check-release-window.yml

  promote:
    needs: [release_window]
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@v1
    with:
      variants: >-
        [{"image":"bluefin"},{"image":"bluefin-nvidia"}]
      cosign_identity_regexp: >-
        ^https://github\.com/projectbluefin/(bluefin|actions)/\.github/workflows/
      run_e2e: false
      # main uses a merge queue ruleset (17070404): gh pr merge --auto is blocked.
      # use_merge_queue doubles as the release gate: false routes to gh pr merge --auto,
      # which the ruleset rejects -- holding :stable to Tuesdays (bluefin#1066).
      # tests/test_promote_release_window.py pins the wiring.
      use_merge_queue: ${{ needs.release_window.outputs.should_enqueue == 'true' }}
    secrets: inherit
