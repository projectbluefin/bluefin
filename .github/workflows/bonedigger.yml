name: issue lifecycle

on:
  issues:
    types: [opened, labeled, closed]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  lifecycle:
    uses: projectbluefin/bonedigger/.github/workflows/lifecycle.yml@d53076732c23203efd7856eaee7c502742897603 # v1
    with:
      brand_name: "Bluefin"
      brand_emoji: "🦖"
    secrets: inherit
