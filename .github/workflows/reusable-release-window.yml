name: reusable-promote-release-window

# Stable release-window gate for promote-testing-to-main.yml (bluefin#1066).
# Extracted from promote-testing-to-main.yml so that caller stays under the
# factory LoC threshold (factory-drift promote-loc-drift, 50-line ceiling) while
# the decision stays a real, executable, unit-tested step — see
# tests/test_promote_release_window.py, which runs this step against a stubbed
# `date` rather than asserting on its text.
on:
  workflow_call:
    outputs:
      should_enqueue:
        description: >
          Whether to enqueue the promotion PR for merge. True only on the
          Tuesday UTC stable release, or on a manual workflow_dispatch fix.
        value: ${{ jobs.window.outputs.should_enqueue }}

jobs:
  window:
    name: Check stable release window
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_enqueue: ${{ steps.window.outputs.should_enqueue }}
    steps:
      - name: Determine whether to enqueue the promotion
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            workflow_dispatch)
              echo "Manual dispatch — allowing the hotfix release escape hatch."
              echo "should_enqueue=true" >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              weekday=$(date -u +%u)
              if [[ "$weekday" == "2" ]]; then
                echo "Tuesday UTC schedule — allowing the weekly stable release."
                echo "should_enqueue=true" >> "$GITHUB_OUTPUT"
              else
                echo "Non-Tuesday schedule — refreshing promotion gates without enqueueing."
                echo "should_enqueue=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "Push trigger — refreshing the promotion PR without enqueueing."
              echo "should_enqueue=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
