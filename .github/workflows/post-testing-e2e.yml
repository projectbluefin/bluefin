name: Post-Testing E2E

# Runs e2e smoke tests after every successful push build on testing.
# This gates testing continuously so the promotion workflow
# (promote-testing-to-main.yml) promotes only e2e-verified commits.
on:
  workflow_run:
    workflows: ["Testing Images"]
    types: [completed]
    # workflow_run definitions are loaded from the default branch. Only
    # testing-branch image builds produce release candidates.
    branches: [testing]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful testing-branch Testing Images run ID to qualify
        required: true
        type: string

permissions: read-all

concurrency:
  group: post-testing-e2e-${{ inputs.run_id || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  e2e:
    # Automated runs require a successful push build. Recovery dispatches bind
    # explicitly to a run ID and validate the same contract before downloading.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.get-digest.outputs.image }}
      nvidia_image: ${{ steps.get-digest.outputs.nvidia_image }}
      run_id: ${{ steps.get-digest.outputs.run_id }}
      source_branch: ${{ steps.get-digest.outputs.source_branch }}
      source_sha: ${{ steps.get-digest.outputs.source_sha }}
    steps:
      - name: Download build digests
        id: get-digest
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          metadata=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}")
          conclusion=$(jq -r '.conclusion // empty' <<<"$metadata")
          event=$(jq -r '.event // empty' <<<"$metadata")
          source_branch=$(jq -r '.head_branch // empty' <<<"$metadata")
          source_sha=$(jq -r '.head_sha // empty' <<<"$metadata")
          if [[ "$conclusion" != success || "$event" != push || "$source_branch" != testing || -z "$source_sha" ]]; then
            echo "::error::Run ${RUN_ID} must be a successful testing-branch push build"
            exit 1
          fi

          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --pattern "image-digest-testing-bluefin-*" \
            --dir /tmp/digests
          DIGEST=$(grep "=" /tmp/digests/image-digest-testing-bluefin-main-x86_64/main-bluefin-x86_64.txt | head -1 | cut -d= -f2-)
          NVIDIA_DIGEST=$(grep "=" /tmp/digests/image-digest-testing-bluefin-nvidia-x86_64/nvidia-bluefin-x86_64.txt | head -1 | cut -d= -f2-)
          {
            echo "image=ghcr.io/${{ github.repository_owner }}/bluefin@${DIGEST}"
            echo "nvidia_image=ghcr.io/${{ github.repository_owner }}/bluefin-nvidia@${NVIDIA_DIGEST}"
            echo "run_id=${RUN_ID}"
            echo "source_branch=${source_branch}"
            echo "source_sha=${source_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Testing image: ghcr.io/${{ github.repository_owner }}/bluefin@${DIGEST}"
          echo "Testing NVIDIA image: ghcr.io/${{ github.repository_owner }}/bluefin-nvidia@${NVIDIA_DIGEST}"

  run-e2e:
    needs: [e2e]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/run-testsuite.yml
    with:
      image: ${{ needs.e2e.outputs.image }}
      suites: smoke,common

  run-e2e-nvidia:
    needs: [e2e]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/run-testsuite.yml
    with:
      image: ${{ needs.e2e.outputs.nvidia_image }}
      suites: smoke,common


  promote-to-testing:
    # Move :testing only after the exact testing-branch build passes every E2E
    # gate. main builds must not replace the candidate under qualification.
    needs: [e2e, run-e2e, run-e2e-nvidia]
    if: >-
      needs.run-e2e.result == 'success' &&
      needs.run-e2e-nvidia.result == 'success' &&
      needs.e2e.outputs.source_branch == 'testing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download all testing image digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ needs.e2e.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --pattern "image-digest-testing-*" \
            --dir /tmp/all-digests

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Promote verified digests to :testing
        run: |
          set -euo pipefail
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          PROMOTED=0

          while IFS= read -r -d '' f; do
            # Each file contains: IMAGE_NAME=sha256:... (= format, one digest per image per arch)
            while IFS='=' read -r image_name digest; do
              [[ -z "${image_name}" || -z "${digest}" || "${image_name}" == *"|"* ]] && continue
              SRC="docker://${REGISTRY}/${image_name}@${digest}"
              DST="docker://${REGISTRY}/${image_name}:testing"
              echo "Promoting ${image_name}@${digest} → :testing"
              skopeo copy --all "${SRC}" "${DST}"
              echo "  ✅ ${image_name}:testing updated"
              PROMOTED=$((PROMOTED + 1))
            done < "$f"
          done < <(find /tmp/all-digests -name "*.txt" -print0)

          echo "✅ Promoted ${PROMOTED} flavor(s) to :testing"

  record-e2e-status:
    name: Record testing commit E2E status
    needs: [e2e, run-e2e, run-e2e-nvidia, promote-to-testing]
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push') ||
       needs.e2e.outputs.source_branch == 'testing')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publish commit-bound E2E result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.e2e.outputs.source_sha || github.event.workflow_run.head_sha }}
          E2E_RESULT: ${{ needs.run-e2e.result }}
          NVIDIA_E2E_RESULT: ${{ needs.run-e2e-nvidia.result }}
          PROMOTION_RESULT: ${{ needs.promote-to-testing.result }}
        run: |
          set -euo pipefail

          state=failure
          description="E2E qualification failed"
          if [[ "$E2E_RESULT" == success && "$NVIDIA_E2E_RESULT" == success && "$PROMOTION_RESULT" == success ]]; then
            state=success
            description="E2E passed and tested digests promoted to :testing"
          fi

          gh api --method POST "repos/${REPO}/statuses/${SHA}" \
            -f state="$state" \
            -f context='e2e/post-testing' \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }}"
