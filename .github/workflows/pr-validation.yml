name: PR Validation — testsuite

on:
  pull_request:
    branches:
      - testing
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-base-branch:
    name: Check PR base branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Require testing as base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "testing" && "$HEAD_REF" != "auto/promote-testing-to-main" ]]; then
            echo "ERROR: PRs must target 'testing', not 'main'."
            echo "The testing→main promotion is handled automatically by promote-testing-to-main.yml."
            echo "Re-open this PR with base 'testing'."
            exit 1
          fi

  validate:
    needs: [check-base-branch]
    if: always() && (needs.check-base-branch.result == 'success' || needs.check-base-branch.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Repo-local constraint only; keep the shared validate-pr logic in projectbluefin/actions.
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/requirements-ci.txt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for undeclared gitlinks
        shell: bash
        env:
          TARGET_TREEISH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          mapfile -t gitlinks < <(git ls-tree -r --full-tree "$TARGET_TREEISH" | awk '$1 == "160000" {print $4}')
          if [[ ${#gitlinks[@]} -eq 0 ]]; then
            exit 0
          fi

          declared_paths=()
          if git cat-file -e "$TARGET_TREEISH:.gitmodules" 2>/dev/null; then
            mapfile -t declared_paths < <(git config --blob "$TARGET_TREEISH:.gitmodules" --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          fi

          dangling=()
          for path in "${gitlinks[@]}"; do
            if ! printf '%s\n' "${declared_paths[@]}" | grep -Fxq -- "$path"; then
              dangling+=("$path")
            fi
          done

          if [[ ${#dangling[@]} -gt 0 ]]; then
            echo "ERROR: gitlink(s) missing .gitmodules entries:"
            printf ' - %s\n' "${dangling[@]}"
            exit 1
          fi

      - name: Validate
        uses: projectbluefin/actions/bootc-build/validate-pr@v1

  unit-tests:
    name: Unit tests
    needs: [check-base-branch]
    if: always() && (needs.check-base-branch.result == 'success' || needs.check-base-branch.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install unit test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bats \
            binutils-dev \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            libdw-dev \
            libelf-dev \
            libiberty-dev \
            libssl-dev \
            zlib1g-dev

      - name: Cache kcov build
        id: kcov-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bluefin-kcov
          key: kcov-v43-a39874f-${{ runner.os }}-${{ runner.arch }}

      - name: Install kcov
        env:
          KCOV_SOURCE_SHA: a39874f938ce13f7a65f253120d1ec946b349ffe # v43
          KCOV_ARCHIVE_SHA256: dac01569171979477b500924be264d2a1bc649dae6010536228cbb319344d516
        run: |
          set -euo pipefail
          cache_dir="${HOME}/.cache/bluefin-kcov"
          if [[ -x "${cache_dir}/usr/local/bin/kcov" ]]; then
            sudo cp -a "${cache_dir}/usr/local/." /usr/local/
            kcov --version
            exit 0
          fi

          archive="${RUNNER_TEMP}/kcov.tar.gz"
          source_dir="${RUNNER_TEMP}/kcov-source"
          build_dir="${RUNNER_TEMP}/kcov-build"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/SimonKagstrom/kcov/archive/${KCOV_SOURCE_SHA}.tar.gz" \
            --output "${archive}"
          echo "${KCOV_ARCHIVE_SHA256}  ${archive}" | sha256sum --check

          mkdir -p "${source_dir}"
          tar --extract --gzip --file "${archive}" \
            --directory "${source_dir}" --strip-components=1
          cmake -S "${source_dir}" -B "${build_dir}" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${build_dir}" --parallel "$(nproc)"
          DESTDIR="${cache_dir}" cmake --install "${build_dir}"
          sudo cp -a "${cache_dir}/usr/local/." /usr/local/
          kcov --version

      - name: Run unit tests
        run: |
          set -o pipefail
          bats --formatter tap tests/unit/ | tee results.tap

      - name: Generate BATS coverage report
        env:
          INCLUDE_PATHS: ${{ github.workspace }}/build_files,${{ github.workspace }}/system_files
          EXCLUDE_PATHS: ${{ github.workspace }}/tests,${{ github.workspace }}/.github
        run: |
          set -euo pipefail
          export KCOV_REPO_ROOT="${GITHUB_WORKSPACE}"
          export KCOV_RAW_DIR="${GITHUB_WORKSPACE}/coverage/kcov-raw"
          export PATH="${GITHUB_WORKSPACE}/tests/coverage/bin:${PATH}"
          mkdir -p "${KCOV_RAW_DIR}"

          # The instrumented rerun exists to collect coverage; the "Run unit
          # tests" step above owns pass/fail, so a failing test must not mask
          # the coverage report.
          coverage_status=0
          kcov \
            --bash-method=DEBUG \
            --bash-parse-files-in-dir="${INCLUDE_PATHS}" \
            --include-path="${INCLUDE_PATHS}" \
            --exclude-path="${EXCLUDE_PATHS}" \
            "${KCOV_RAW_DIR}/top" \
            bash -c 'exec bats --formatter tap tests/unit/ > coverage/bats-coverage-run.tap 2>&1' \
            || coverage_status=$?
          echo "instrumented bats exit status: ${coverage_status}"
          grep -c '^ok' coverage/bats-coverage-run.tap
          python3 tests/coverage/merge_kcov.py \
            --raw-dir "${KCOV_RAW_DIR}" \
            --output-dir coverage/kcov \
            --repo-root "${GITHUB_WORKSPACE}"
          cat coverage/kcov/summary.md >> "${GITHUB_STEP_SUMMARY}"
          rm -rf "${KCOV_RAW_DIR}"

      - name: Upload TAP results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bats-tap-results
          path: results.tap

      - name: Upload BATS coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bats-kcov-report
          path: coverage/kcov

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  testsuite:
    name: E2E smoke
    # Only gate actual merges — not every PR push.
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      packages: write  # testsuite pushes screenshot OCI artifacts to GHCR
    # Keep the testsuite SHA centralized in run-testsuite.yml.
    uses: ./.github/workflows/run-testsuite.yml
    with:
      image: ghcr.io/projectbluefin/bluefin:testing
      suites: smoke
